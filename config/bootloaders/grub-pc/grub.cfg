source /boot/grub/config.cfg

# Live boot
#
# /live/vmlinuz and /live/initrd.img are always the newest kernel in the
# image, so this menu never has to be re-written when the kernel version
# changes.
set default=0
set timeout=6

menuentry "SidSpin Live (amd64)" --hotkey=l {
	linux	/live/vmlinuz boot=live components live-config.username=user quiet splash console=ttyS0,115200n8 findiso=${iso_path}
	initrd	/live/initrd.img
}
menuentry "SidSpin Live (amd64, fail-safe)" {
	linux	/live/vmlinuz boot=live components memtest noapic noapm nodma nomce nosmp nosplash vga=788
	initrd	/live/initrd.img
}

submenu 'Utilities...' --hotkey=u {
	source /boot/grub/theme.cfg

	# Firmware setup (UEFI)
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --hotkey=f {
			fwsetup
		}
	fi

	# Verify the checksums
	menuentry "Verify integrity of the boot medium" --hotkey=v {
		linux	/live/vmlinuz boot=live components live-config.username=user console=ttyS0,115200n8 findiso=${iso_path} verify-checksums
		initrd	/live/initrd.img
	}
}
