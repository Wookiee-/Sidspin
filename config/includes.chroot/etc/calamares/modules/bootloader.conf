# SidSpin — the Calamares "bootloader" module in Debian ships without a
# default configuration file, so it has to be given one here — otherwise it
# bails out with "Configuration missing" and GRUB is never installed on the
# target system.
#
# This module runs grub-install (BIOS: MBR of the disk chosen on the
# partition page, EFI: the EFI system partition) and then grub-mkconfig,
# which reads /etc/default/grub (written by the "grubcfg" module) and the
# /boot directory of the *installed* system, so /etc/default/grub's
# GRUB_DEFAULT=0 always points at the newest kernel that is installed at
# that point.

efiBootLoader: grub

grubInstall: grub-install
grubMkconfig: grub-mkconfig
grubProbe: grub-probe
efiBootMgr: efibootmgr

grubCfg: /boot/grub/grub.cfg
efiBootloaderId: SidSpin

installEFIFallback: true
