# SidSpin — desktop environment chooser.
#
# Loads our own QML from the branding directory, so the page looks like
# SidSpin rather than the stock Calamares example.
#
# The chosen id is written to GlobalStorage under the key
# "packagechooser_packagechooserq" and picked up by the shellprocess
# module, which runs /usr/bin/sidspin-install-de in the target.
#
# The value is "<desktop>:<profile>", for example "gnome:minimal".

qmlSearch: branding
qmlFilename: /etc/calamares/branding/sidspin/chooser.qml

# Default selection: the desktop the live image boots into, with its
# usual applications.
packageChoice: kde-plasma:full

labels:
    step: "Desktop environment"
