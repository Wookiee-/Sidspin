# SidSpin — welcome page.
#
# The stock welcome page says "Welcome to the Calamares installer for X".
# This one loads our own QML from the branding directory instead, so the
# first screen explains what SidSpin is and what the install will do.

qmlSearch: branding
qmlFilename: /etc/calamares/branding/sidspin/welcome.qml

showSupportUrl:         true
showKnownIssuesUrl:     true
showReleaseNotesUrl:    true

requirements:
    requiredStorage:    8
    requiredRam:        1.0
    check:
        - storage
        - ram
        - power
        - root
    required:
        - storage
        - ram
        - root
