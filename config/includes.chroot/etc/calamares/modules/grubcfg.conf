# SidSpin — GRUB defaults written into the target system.
#
# Runs after the packages are installed and before GRUB is put on the disk,
# so grub-mkconfig picks these up.

overwrite: false
keep_distributor: true
prefer_grub_d: false

kernel_params:
    - quiet
    - splash

defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: 0
    GRUB_DISABLE_SUBMENU: true
    GRUB_TERMINAL_OUTPUT: "gfxterm console"
    GRUB_DISABLE_RECOVERY: true

always_use_defaults: false
