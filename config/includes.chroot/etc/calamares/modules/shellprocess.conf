# SidSpin — install the desktop the user picked.
#
# ${gs[packagechooser_packagechooserq]} is expanded by Calamares from
# GlobalStorage; it holds the choice made on the "Desktop environment"
# page, as "<desktop>:<profile>" — kde-plasma:full, gnome:minimal, and so
# on.
#
# The script runs inside the target system (chroot), so apt installs into
# the disk you are installing to, not into the live session.

script:
    - "/usr/bin/sidspin-install-de ${gs[packagechooser_packagechooserq]}"

dontChroot: false
timeout: 3600
verbose: true
