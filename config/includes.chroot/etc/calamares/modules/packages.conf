# SidSpin — package operations in the target system.
#
# The target starts as a copy of the live session, so the live-only
# packages have to go.  GRUB is installed here (rather than in the live
# image) because the live session never boots from disk.

backend: apt
update_db: true

operations:
    # Bootloader for the installed system.  The "-bin" packages provide the
    # platform files grub-install needs without dragging in the device
    # installers (which would prompt inside the chroot).
    - install:
        - grub-common
        - grub2-common
        - grub-pc-bin
        - grub-efi-amd64-bin
        - efibootmgr

    # Live-session-only packages.
    - remove:
        - live-boot
        - live-boot-doc
        - live-boot-initramfs-tools
        - live-config
        - live-config-doc
        - live-config-systemd
        - live-tools
        - live-task-localisation
        - live-task-recommended
        - calamares-settings-debian
