# SidSpin — desktop environment chooser.
#
# A single-select ("radio") list of the desktops that can be installed.
# The selected id is written to GlobalStorage under the key
# "packagechooser_packagechooser" and picked up later by the shellprocess
# module, which runs /usr/bin/sidspin-install-de in the target system.

mode: radio
method: legacy

# KDE Plasma is what the live ISO boots into, so it is the default.
default: kde-plasma

labels:
    step: "Desktop environment"

items:
    - id: kde-plasma
      name: "KDE Plasma"
      description: "The full KDE Plasma desktop. This is the same desktop the live image boots into: a fast, polished desktop with the full set of KDE applications."
      packages:
        - kde-plasma-desktop
        - kwin-x11
        - sddm
        - plasma-nm
        - xdg-desktop-portal-kde

    - id: gnome
      name: "GNOME"
      description: "The GNOME desktop. Clean and simple, built around activities and a large application suite."
      packages:
        - task-gnome-desktop
        - gdm3

    - id: xfce
      name: "XFCE"
      description: "A lightweight desktop that uses very little memory. A good fit for older machines."
      packages:
        - task-xfce-desktop
        - lightdm

    - id: mate
      name: "MATE"
      description: "A classic, traditional desktop. Familiar layout, modest resource use."
      packages:
        - task-mate-desktop
        - lightdm

    - id: lxqt
      name: "LXQt"
      description: "A very light Qt desktop. Fast to start and easy on resources."
      packages:
        - task-lxqt-desktop
        - sddm

    - id: cinnamon
      name: "Cinnamon"
      description: "A traditional desktop with a familiar panel and menu, developed alongside Mint."
      packages:
        - task-cinnamon-desktop
        - lightdm
