# SidSpin — Calamares settings.
#
# The live ISO boots into a minimal KDE Plasma session.  This installer
# copies that system to the disk and lets you pick which desktop you
# actually want on the installed machine.
#
# The "packagechooser" step writes the selected desktop id into
# GlobalStorage (key: packagechooser_packagechooser).  The "shellprocess"
# step later reads that key and runs /usr/bin/sidspin-install-de inside the
# target to install the desktop and point the display manager at it.

modules-search: [ local, /usr/lib/calamares/modules ]

sequence:
    # Phase 1 — the pages the user walks through.
    - show:
        - welcome
        - locale
        - keyboard
        - partition
        - users
        - packagechooser
        - summary

    # Phase 2 — the actual installation.
    - exec:
        - partition
        - mount
        - unpackfs
        - machineid
        - fstab
        - locale
        - keyboard
        - localecfg
        - users
        - displaymanager
        - networkcfg
        - hwclock
        - services-systemd
        - packages
        - shellprocess
        - grubcfg
        - bootloader
        - plymouthcfg
        - initramfscfg
        - initramfs
        - umount

    # Phase 3 — the "all done" page.
    - show:
        - finished

branding: sidspin

# "Cancel" stays available until the real installation starts.
disable-cancel: false
disable-cancel-during-exec: false

# Ask once before writing to the disk.
prompt-install: true

# This is a full installer, not a post-install setup tool.
dont-chroot: false
oem-setup: false

quit-at-end: false
